name: Tests

# Run the parser test suite on every push to main and on every pull request,
# so a change that breaks parseOutline / slugify / matchWindow shows up as a red
# check before it is merged.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        # --ignore-scripts skips the "prepare" webpack build; the test job only
        # needs the parser compiled by tsc, not the packaged .jpl.
        run: npm ci --ignore-scripts

      - name: Run tests
        run: npm test
